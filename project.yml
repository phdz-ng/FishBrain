name: FishBrain
options:
  bundleIdPrefix: io.github.phdz-ng
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    # chronod caches the widget's description per bundle version. Bump this whenever the widget's
    # configuration changes (kind, sizes, intent), or macOS keeps serving the old description and
    # the placed widget stays blank.
    CURRENT_PROJECT_VERSION: 5
    MARKETING_VERSION: "1.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  FishBrain:
    type: application
    platform: macOS
    sources:
      - FishBrain
      - Shared
    entitlements:
      path: FishBrain/FishBrain.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        # Talking to Anthropic and OpenAI for Create with AI. The app only: the widget never goes online.
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
        # Shared folder used when the App Group isn't provisioned (builds without a developer team).
        com.apple.security.temporary-exception.files.home-relative-path.read-write:
          - /Library/Application Support/FishBrain/
    info:
      path: FishBrain/Info.plist
      properties:
        CFBundleDisplayName: FishBrain
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        LSApplicationCategoryType: public.app-category.education
        AppGroupIdentifier: $(APP_GROUP_ID)
        CFBundleURLTypes:
          - CFBundleURLName: $(BUNDLE_ID_PREFIX).fishbrain
            CFBundleURLSchemes:
              - fishbrain
        # Files FishBrain can import: double-clicking one, Open With, or AirDrop opens the Import sheet on it.
        # Alternate rank, so Numbers, Excel and Anki keep the files they already own.
        CFBundleDocumentTypes:
          - CFBundleTypeName: CSV spreadsheet
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.comma-separated-values-text
              - public.tab-separated-values-text
          - CFBundleTypeName: Anki deck package
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - $(BUNDLE_ID_PREFIX).apkg
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: $(BUNDLE_ID_PREFIX).apkg
            UTTypeDescription: Anki deck package
            UTTypeConformsTo:
              - public.zip-archive
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - apkg
              public.mime-type:
                - application/apkg
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).fishbrain
        ENABLE_HARDENED_RUNTIME: true
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: FishBrainWidget
        embed: true
      # Apple Intelligence's framework only exists on macOS 26 and later; the app still runs from macOS 14.
      - sdk: FoundationModels.framework
        weak: true
  FishBrainWidget:
    type: app-extension
    platform: macOS
    sources:
      - FishBrainWidget
      - Shared
    entitlements:
      path: FishBrainWidget/FishBrainWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
        # Shared folder used when the App Group isn't provisioned (builds without a developer team).
        com.apple.security.temporary-exception.files.home-relative-path.read-write:
          - /Library/Application Support/FishBrain/
    info:
      path: FishBrainWidget/Info.plist
      properties:
        CFBundleDisplayName: FishBrain
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        AppGroupIdentifier: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).fishbrain.widget
        ENABLE_HARDENED_RUNTIME: true
        SKIP_INSTALL: true
        APPLICATION_EXTENSION_API_ONLY: true
  FishBrainTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - FishBrainTests
      - Shared
      # The widget's deck picker, compiled in so its logic can be tested.
      - FishBrainWidget/SelectDeckIntent.swift
      # App views are compiled into the tests too; only the app entry point is left out.
      - path: FishBrain
        excludes:
          - FishBrainApp.swift
          - Assets.xcassets
          - "*.entitlements"
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).fishbrain.tests
        GENERATE_INFOPLIST_FILE: true
schemes:
  FishBrain:
    build:
      targets:
        FishBrain: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FishBrainTests
